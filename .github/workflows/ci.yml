name: ci.yml

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - v5

permissions:
  contents: read

env:
  GO111MODULE: on

jobs:
  # NOTE: golangci-lint is disabled on the v5 branch: static analysis tooling
  # does not yet understand Go 1.27 generic methods (go/types export data
  # needs a release cycle to catch up). Re-enable once golangci-lint supports
  # Go 1.27.

  build:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.27'

      - name: go vet
        run: go vet -x ./...

      - name: Check Formatting
        run: test -z "$(gofmt -s -l -w . | tee /dev/stderr)"

      - name: Run Tests
        run: go test -v ./...

      - name: Coverage (profile.cov)
        run: go test -covermode=count -coverprofile=profile.cov

      - name: Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: profile.cov
          format: golang
